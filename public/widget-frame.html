<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support chat</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font:14px/1.45 Inter,system-ui,sans-serif;background:transparent;color:#18201f}.launcher{position:absolute;right:12px;bottom:12px;width:64px;height:64px;border:0;border-radius:50%;background:var(--brand,#6857f5);color:white;font-size:26px;box-shadow:0 12px 34px #15182f42;cursor:pointer}.panel{display:none;position:absolute;inset:0 0 0 0;border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 18px 55px #15182f38;border:1px solid #e6e8e7}.open .panel{display:grid;grid-template-rows:auto 1fr auto}.open .launcher{display:none}.head{padding:18px;background:var(--brand,#6857f5);color:#fff;display:flex;align-items:center;gap:11px}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#ffffff2e;display:grid;place-items:center;font-weight:800}.title{font-weight:750;font-size:16px}.sub{font-size:12px;opacity:.8}.close{margin-left:auto;background:transparent;border:0;color:white;font-size:24px;cursor:pointer}.messages{padding:18px;overflow:auto;background:#f7f8f8;display:flex;flex-direction:column;gap:10px}.msg{max-width:86%;padding:11px 13px;border-radius:16px;white-space:pre-wrap}.assistant{align-self:flex-start;background:#fff;border:1px solid #e5e8e7}.user{align-self:flex-end;background:var(--brand);color:#fff}.typing{opacity:.65}.sources{font-size:11px;margin-top:6px;opacity:.7}.composer{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #e8eae9}.composer textarea{resize:none;flex:1;max-height:90px;border:1px solid #dadddc;border-radius:13px;padding:10px;font:inherit}.send{border:0;border-radius:12px;background:var(--brand);color:#fff;padding:0 16px;font-weight:700;cursor:pointer}.send:disabled{opacity:.5}.dark .panel{background:#121716;color:#edf2f0;border-color:#313a37}.dark .messages{background:#0c1110}.dark .assistant,.dark .composer{background:#171d1b;border-color:#313a37}.dark textarea{background:#0d1211;color:#fff;border-color:#39423f}@media(max-width:480px){.panel{border-radius:18px}.head{padding:15px}.messages{padding:13px}}
.agent{align-self:flex-start;background:#e8f7f0;border:1px solid #bfe7d4}</style></head><body><button class="launcher" aria-label="Open support chat">✦</button><section class="panel" aria-label="Support conversation"><header class="head"><div class="avatar">H</div><div><div class="title">Support</div><div class="sub">AI answers from verified knowledge</div></div><button class="close" aria-label="Close chat">×</button></header><main class="messages" aria-live="polite"></main><form class="composer"><textarea rows="1" maxlength="2000" placeholder="Ask a question…" aria-label="Message"></textarea><button class="send" type="submit">Send</button></form></section><script>
const params=new URLSearchParams(location.search),botId=params.get('botId'),parentOrigin=document.referrer?new URL(document.referrer).origin:'';const visitorKey=localStorage.aidenVisitorKey||localStorage.helioVisitorKey||crypto.randomUUID()+crypto.randomUUID();localStorage.aidenVisitorKey=visitorKey;let conversationId=localStorage['aidenConversation:'+botId]||localStorage['helioConversation:'+botId]||'',config,open=false;const root=document.body,messages=document.querySelector('.messages'),input=document.querySelector('textarea'),send=document.querySelector('.send');
function resize(){parent.postMessage({type:'aiden:resize',open,position:config?.appearance?.position||'bottom-right'},'*')}function add(role,text,extra=''){const el=document.createElement('div');el.className='msg '+role;el.textContent=text;if(extra){const src=document.createElement('div');src.className='sources';src.textContent=extra;el.appendChild(src)}messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}async function boot(){const q='?origin='+encodeURIComponent(parentOrigin);const r=await fetch('/api/public/widget/'+encodeURIComponent(botId)+'/config'+q);if(!r.ok)throw Error('Widget unavailable');config=await r.json();root.style.setProperty('--brand',config.appearance.color);root.classList.toggle('dark',config.appearance.theme==='dark'||(config.appearance.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches));document.querySelector('.title').textContent=config.name;document.querySelector('.avatar').textContent=config.name[0].toUpperCase();add('assistant',config.welcomeMessage);if(conversationId){const h=await fetch('/api/public/widget/'+encodeURIComponent(botId)+'/history?origin='+encodeURIComponent(parentOrigin)+'&visitorKey='+encodeURIComponent(visitorKey)+'&conversationId='+encodeURIComponent(conversationId));if(h.ok){messages.innerHTML='';for(const m of await h.json())add(m.role,m.content)}}resize()}window.addEventListener('message',e=>{if(e.data?.type==='aiden:init'||e.data?.type==='helio:init')resize()});document.querySelector('.launcher').onclick=()=>{open=true;root.classList.add('open');resize();input.focus()};document.querySelector('.close').onclick=()=>{open=false;root.classList.remove('open');resize()};document.querySelector('form').onsubmit=async e=>{e.preventDefault();const question=input.value.trim();if(!question)return;input.value='';add('user',question);const bubble=add('assistant','Thinking…');bubble.classList.add('typing');send.disabled=true;try{const r=await fetch('/api/public/widget/'+encodeURIComponent(botId)+'/chat?origin='+encodeURIComponent(parentOrigin),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({visitorKey,conversationId:conversationId||undefined,question})});if(!r.ok)throw Error();bubble.textContent='';const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const{value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop();for(const raw of events){const line=raw.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const data=JSON.parse(line.slice(6));if(raw.startsWith('event: delta'))bubble.textContent+=data.text;if(raw.startsWith('event: replace'))bubble.textContent=data.text;if(raw.startsWith('event: done')){conversationId=data.conversationId;localStorage['aidenConversation:'+botId]=conversationId;if(data.sources?.length){const s=document.createElement('div');s.className='sources';s.textContent='Sources: '+[...new Set(data.sources.map(x=>x.name))].join(', ');bubble.appendChild(s)}}}}}catch{bubble.textContent='Support is temporarily unavailable. Please try again.'}finally{bubble.classList.remove('typing');send.disabled=false;messages.scrollTop=messages.scrollHeight}};boot().catch(()=>{document.querySelector('.launcher').disabled=true});
</script></body></html>
